server:
  port: 8081
spring:
  application:
    name: contrato-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contrato_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      observation-enabled: false
      properties:
        enable.idempotence: true
app:
  kafka:
    topics:
      contrato-eventos: ${CONTRATO_EVENTOS_TOPIC:freela.contrato.eventos.v1}
    outbox:
      fixed-delay: ${CONTRATO_OUTBOX_FIXED_DELAY:1000}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} traceId=%X{traceId} spanId=%X{spanId} thread=%thread logger=%logger{36} - %msg%n"
  level:
    root: INFO
    br.com.freela: INFO
    org.hibernate.SQL: INFO
