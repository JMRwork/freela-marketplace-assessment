server:
  port: 8083
spring:
  application:
    name: reputacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reputacao_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reputacao-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
      observation-enabled: true
app:
  kafka:
    listener:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
      retry-attempts: ${KAFKA_RETRY_ATTEMPTS:2}
      retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
      dead-letter-retention-ms: ${KAFKA_DLT_RETENTION_MS:2592000000}
    topics:
      contrato-eventos: ${CONTRATO_EVENTOS_TOPIC:freela.contrato.eventos.v1}
      partitions: 3
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
logging:
  level:
    root: INFO
    br.com.freela: INFO
